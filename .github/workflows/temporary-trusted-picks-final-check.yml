name: Validate trusted picks final
on:
  push:
    branches: [feature/trusted-food-picks]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test -- --run
      - run: npm run typecheck
      - run: npm run build

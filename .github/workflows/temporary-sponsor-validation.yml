name: Validate Sponsored placements
on:
  push:
    branches: ["feature/sponsored-boosts"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install reproducible dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit and security tests
        run: npm run test -- --run
      - name: Build and route generation
        run: npm run build
      - name: Typecheck
        run: npm run typecheck

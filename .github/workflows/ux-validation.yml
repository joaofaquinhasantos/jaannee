name: UX validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [ux/complete-prelaunch]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm run test -- --run
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build

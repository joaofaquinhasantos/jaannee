name: Check isolated JaanNee demo
on:
  push:
    branches: ["feature/database-free-demo"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm run test -- --run
      # The TanStack Vite plugin generates routeTree.gen.ts during build.
      # Building first ensures TypeScript knows about the new /demo route.
      - name: Production build and generated route types
        run: npm run build
      - name: Typecheck generated route tree
        run: npm run typecheck

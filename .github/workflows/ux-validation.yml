name: UX validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [ux/complete-prelaunch]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund --loglevel=error
      - name: Unit tests
        shell: bash
        run: |
          set +e
          npm run test -- --run > /tmp/tests.log 2>&1
          status=$?
          tail -80 /tmp/tests.log
          exit $status
      - name: Typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1
          status=$?
          tail -120 /tmp/typecheck.log
          exit $status
      - name: Production build
        shell: bash
        run: |
          set +e
          npm run build > /tmp/build.log 2>&1
          status=$?
          tail -120 /tmp/build.log
          exit $status

name: Validate restaurant business demo
on:
  push:
    branches: ["feature/restaurant-free-to-pro-demo"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run unit tests
        run: npm run test -- --run
      - name: Build and generate TanStack route types
        run: npm run build
      - name: Typecheck
        run: npm run typecheck

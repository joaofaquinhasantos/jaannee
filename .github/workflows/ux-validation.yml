name: UX validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [ux/complete-prelaunch]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund --loglevel=error
      - name: Commit refreshed lockfile
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh npm lockfile"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Unit tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run test -- --run > tests.log 2>&1
          status=$?
          echo "$status" > tests.status
          tail -80 tests.log
          exit $status
      - name: Production build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          status=$?
          echo "$status" > build.status
          tail -120 build.log
          exit $status
      - name: Typecheck generated route tree
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          status=$?
          echo "$status" > typecheck.status
          tail -120 typecheck.log
          exit $status
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-diagnostics
          path: |
            tests.log
            tests.status
            typecheck.log
            typecheck.status
            build.log
            build.status
          retention-days: 3
      - name: Validation gate
        if: always()
        shell: bash
        run: |
          test "$(cat tests.status)" = "0"
          test "$(cat typecheck.status)" = "0"
          test "$(cat build.status)" = "0"

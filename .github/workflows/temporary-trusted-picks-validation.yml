name: Validate trusted picks feature
on:
  push:
    branches: [feature/trusted-food-picks]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm run test -- --run
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

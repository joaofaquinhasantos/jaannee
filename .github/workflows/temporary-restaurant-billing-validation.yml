name: Validate restaurant Stripe foundation
on:
  push:
    branches: ["feature/restaurant-billing-foundation"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test -- --run
      - run: npm run build
      - run: npm run typecheck

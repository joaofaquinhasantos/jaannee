name: UX validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: Unit tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run test -- --run > tests.log 2>&1
          status=$?
          echo "$status" > tests.status
          tail -80 tests.log
          exit $status
      - name: Production build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          status=$?
          echo "$status" > build.status
          tail -120 build.log
          exit $status
      - name: Typecheck generated route tree
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          status=$?
          echo "$status" > typecheck.status
          tail -120 typecheck.log
          exit $status
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-diagnostics
          path: |
            tests.log
            tests.status
            typecheck.log
            typecheck.status
            build.log
            build.status
          retention-days: 2
      - name: Validation gate
        if: always()
        shell: bash
        run: |
          test "$(cat tests.status)" = "0"
          test "$(cat typecheck.status)" = "0"
          test "$(cat build.status)" = "0"
